[project]
name = "f1si"
version = "0.1.0"
description = "F1 Stochastic Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.3,<3",
  # pandas stays below 3 so a future FastF1 source remains possible (DEC-012)
  "pandas>=2.3.3,<3",
  # DuckDB 2.0 files are unreadable by 1.x; wait for 2.0.1 before moving up (DEC-011)
  "duckdb>=1.5.6,<2",
  "matplotlib>=3.11,<4",
  "requests>=2.34,<3",
  "requests-cache>=1.3,<2",
]

[project.scripts]
f1si = "f1si.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "hypothesis>=6.170",
  "ruff==0.17.1",
  "mypy>=2.4,<3",
  "pandas-stubs>=2.3.3,<3",
  "types-requests",
  "pre-commit>=4.7",
  "pytest-cov>=7.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Planning docs and design docs are prose, not code: ruff 0.17 would reformat their code blocks
extend-exclude = [".planning", "F1 Docs"]

[tool.ruff.lint]
# NPY002 bans legacy np.random calls: explicit Generators only (FND-03)
select = ["E", "W", "F", "I", "B", "UP", "NPY", "RUF", "SIM", "PT", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network"]
markers = ["network: needs internet and a real data source; excluded by default (D-10)"]
filterwarnings = ["error::DeprecationWarning:f1si"]

[tool.coverage.run]
source = ["f1si"]
branch = true
