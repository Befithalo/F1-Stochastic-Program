name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=f1si --cov-report=term
      - name: "Canary: a planted leak must fail the import ban (DAT-04)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp tests/fixtures/leaky_consumer.py src/f1si/_canary.py
          if uv run pytest tests/guards/test_import_ban.py -q -p no:cacheprovider; then
            echo "::error::planted leak in src/f1si/_canary.py was NOT caught"
            rm -f src/f1si/_canary.py
            exit 1
          fi
          rm -f src/f1si/_canary.py
          echo "Canary caught as expected"
