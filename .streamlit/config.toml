[theme]
base = "dark"
primaryColor = "#9BA1A8"
backgroundColor = "#1C1F23"
secondaryBackgroundColor = "#24282D"
textColor = "#ECEAE4"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
borderColor = "#1C1F23"
